name: Commit Dependabot locks

on:
  workflow_run:
    workflows: ["Dependabot lock build"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  commit-locks:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate current Dependabot head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.user.login')" = "dependabot[bot]"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.repo.full_name')" = "${GITHUB_REPOSITORY}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')" = "${HEAD_SHA}"
          head_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.ref')"
          [[ "${head_ref}" == dependabot/* ]]
          echo "number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "head_ref=${head_ref}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Checkout validated Dependabot head
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Download generated locks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "${RUN_ID}" \
            --name "dependabot-locks-${PR_NUMBER}" \
            --dir "${RUNNER_TEMP}/dependabot-locks"

      - name: Commit only generated locks
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/dependabot-locks"
          test -d "${artifact_dir}"
          test -z "$(find "${RUNNER_TEMP}/dependabot-locks" -type l -print -quit)"
          test "$(find "${artifact_dir}" -type f | wc -l | tr -d ' ')" = "4"
          for lock in requirements.lock requirements-dev.lock requirements-tools.lock requirements-build.lock; do
            test -f "${artifact_dir}/${lock}"
            install -m 0644 "${artifact_dir}/${lock}" "${lock}"
          done
          if git diff --quiet -- requirements.lock requirements-dev.lock requirements-tools.lock requirements-build.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock requirements-dev.lock requirements-tools.lock requirements-build.lock
          git commit -m "chore(deps): refresh hashed locks"
          git push origin "HEAD:${HEAD_REF}"
