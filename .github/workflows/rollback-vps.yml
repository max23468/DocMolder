name: Rollback VPS

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Tag or SHA already merged into main
        required: true

permissions:
  contents: read

concurrency:
  group: rollback-vps
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back Oracle VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCMOLDER_VPS_HOST: ${{ secrets.DOCMOLDER_VPS_HOST }}
      DOCMOLDER_VPS_USER: ${{ secrets.DOCMOLDER_VPS_USER }}
      DOCMOLDER_VPS_PORT: ${{ secrets.DOCMOLDER_VPS_PORT }}
      DOCMOLDER_VPS_SSH_KNOWN_HOSTS: ${{ secrets.DOCMOLDER_VPS_SSH_KNOWN_HOSTS }}
      TARGET_REF: ${{ inputs.target_ref }}

    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate rollback revision
        run: |
          set -euo pipefail
          git fetch --force --tags origin main
          target_sha="$(git rev-parse --verify --end-of-options "${TARGET_REF}^{commit}")"
          if ! git merge-base --is-ancestor "${target_sha}" origin/main; then
            echo "::error::Rollback target is not part of origin/main."
            exit 1
          fi
          echo "TARGET_SHA=${target_sha}" >> "${GITHUB_ENV}"

      - name: Validate deploy secrets
        env:
          DOCMOLDER_VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.DOCMOLDER_VPS_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail

          missing=0
          for var in DOCMOLDER_VPS_HOST DOCMOLDER_VPS_SSH_PRIVATE_KEY_B64 DOCMOLDER_VPS_SSH_KNOWN_HOSTS; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret: ${var}"
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Set deploy defaults
        run: |
          set -euo pipefail
          echo "DOCMOLDER_VPS_USER=${DOCMOLDER_VPS_USER:-opc}" >> "${GITHUB_ENV}"
          echo "DOCMOLDER_VPS_PORT=${DOCMOLDER_VPS_PORT:-22}" >> "${GITHUB_ENV}"

      - name: Prepare SSH key
        env:
          DOCMOLDER_VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.DOCMOLDER_VPS_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          printf '%s' "${DOCMOLDER_VPS_SSH_PRIVATE_KEY_B64}" | base64 --decode > "${HOME}/.ssh/docmolder_vps"
          chmod 600 "${HOME}/.ssh/docmolder_vps"

      - name: Prepare known hosts
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          touch "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"

          printf '%s\n' "${DOCMOLDER_VPS_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          echo "SSH_STRICT=yes" >> "${GITHUB_ENV}"

      - name: Roll back to trusted main revision
        run: |
          set -euo pipefail

          ssh \
            -i "${HOME}/.ssh/docmolder_vps" \
            -p "${DOCMOLDER_VPS_PORT}" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o StrictHostKeyChecking="${SSH_STRICT}" \
            "${DOCMOLDER_VPS_USER}@${DOCMOLDER_VPS_HOST}" \
            "sudo chown root:docmolder /etc/docmolder/docmolder.env &&
             sudo chmod 640 /etc/docmolder/docmolder.env &&
             sudo /usr/local/sbin/docmolder-update-vps rollback '${TARGET_SHA}'"

      - name: Rollback summary
        if: always()
        run: |
          {
            echo "## Rollback VPS"
            echo ""
            echo "- Target revision: \`${TARGET_SHA:-not-resolved}\`"
            echo "- Workflow conclusion: \`${{ job.status }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
